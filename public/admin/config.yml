# Decap CMS — GitHub OAuth backend.
# The /api/auth and /api/callback serverless routes (deployed alongside this
# site on Vercel) handle the OAuth handshake using GITHUB_CLIENT_ID and
# GITHUB_CLIENT_SECRET env vars set in the Vercel project.

backend:
  name: github
  repo: signal24news/signal24-website
  branch: main
  base_url: https://signal24.info
  auth_endpoint: api/auth

# Uncomment when running `npx decap-server` for local CMS development.
# local_backend: true

site_url: https://signal24.info
display_url: https://signal24.info
logo_url: /favicon.svg

media_folder: "public/uploads"
public_folder: "/uploads"

# Direct publishing — no editorial review queue.
# Switch back to `publish_mode: editorial_workflow` once you have more than one author.

collections:
  - name: "articles"
    label: "Articles"
    label_singular: "Article"
    folder: "content/articles"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}} — {{category}} — {{date | date('YYYY-MM-DD')}}"
    sortable_fields: ['date', 'title', 'category']
    view_filters:
      - label: "Featured"
        field: featured
        pattern: true
      - label: "Breaking"
        field: breaking
        pattern: true
      - label: "World"
        field: category
        pattern: world
      - label: "Middle East"
        field: category
        pattern: middle-east
      - label: "Business"
        field: category
        pattern: business
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Excerpt", name: "excerpt", widget: "text", required: false, hint: "1–2 sentence summary. Used for cards, social shares, and SEO." }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "World", value: "world" }
          - { label: "Middle East", value: "middle-east" }
          - { label: "Business", value: "business" }
          - { label: "AI & Tech", value: "ai-tech" }
          - { label: "Sports", value: "sports" }
          - { label: "Fact Check", value: "fact-check" }
          - { label: "Explainers", value: "explainers" }
        default: "world"
      - { label: "Publish date", name: "date", widget: "datetime" }
      - { label: "Author", name: "author", widget: "string", default: "Saad Ali", hint: "Use the exact name from the author profile, e.g. Saad Ali." }
      - { label: "Featured image", name: "image", widget: "image", hint: "Use a 16:9 image, 1600×900 or larger." }
      - { label: "Image caption / alt", name: "imageAlt", widget: "string", required: false }
      - { label: "Featured on homepage", name: "featured", widget: "boolean", default: false, hint: "The 3 newest featured stories fill the top of the homepage. The newest one gets the big slot." }
      - { label: "Breaking news", name: "breaking", widget: "boolean", default: false }
      - { label: "Tags", name: "tags", widget: "list", required: false, default: [] }
      - label: "Signal Box"
        name: "signal"
        widget: "object"
        required: false
        collapsed: false
        hint: "Three short lines shown at the top of the story. Leave empty to hide the box."
        fields:
          - { label: "What happened", name: "whatHappened", widget: "text", required: false }
          - { label: "Why it matters", name: "whyItMatters", widget: "text", required: false }
          - { label: "What's next", name: "whatsNext", widget: "text", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
